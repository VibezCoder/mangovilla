services:
  - type: web
    name: mango-villa
    runtime: static
    staticPublishPath: .
    headers:
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/js/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
